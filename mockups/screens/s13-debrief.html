<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S13 — Debrief · Threshold</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/screens.css" />
</head>

<body>
    <div class="stage">
        <div class="stage-label">S13 · Post-Mission Debrief</div>
        <div class="phone">
            <div class="phone-status"><span class="time">9:41</span><span class="icons">●●● Wifi</span></div>
            <div class="screen">
                <div class="nav-header">
                    <a class="back" href="s12-in-progress.html">←</a>
                    <h1>Debrief</h1>
                </div>
                <div class="screen-scroll no-tab stack-lg">
                    <div>
                        <div class="kicker">Level 1 complete?</div>
                        <h2 class="title" style="font-size:22px;margin-top:6px">How hard was it actually?</h2>
                        <p class="subtitle" style="margin-top:8px">Capture reality while it's fresh. Both fields
                            required.</p>
                    </div>

                    <div class="slider-wrap">
                        <div class="slider-value">
                            <span class="fog" style="font-size:13px">Actual difficulty</span>
                            <span class="num" id="val">28</span>
                        </div>
                        <input type="range" id="diff" min="0" max="100" value="28" />
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)">
                            <span>Easy</span><span>Freeze</span>
                        </div>
                    </div>

                    <div class="field">
                        <label for="notes">Quick reflection</label>
                        <textarea class="textarea"
                            id="notes">Wrote the comment in under 3 minutes. Felt awkward hitting send, but no one attacked me. Expected doom; got silence + one like.</textarea>
                    </div>

                    <div class="card card-soft" style="display:flex;justify-content:space-between;align-items:center">
                        <span class="fog" style="font-size:13px">Previously expected</span>
                        <span style="font-family:var(--mono);font-weight:700">62</span>
                    </div>

                    <div class="footer-actions">
                        <a class="btn btn-primary" href="s14-result.html">Submit debrief</a>
                    </div>
                </div>
                <div class="home-indicator"></div>
            </div>
        </div>
    </div>
    <script>
        var range = document.getElementById('diff');
        var val = document.getElementById('val');
        range.addEventListener('input', function () { val.textContent = range.value; });
    </script>
</body>

</html>
